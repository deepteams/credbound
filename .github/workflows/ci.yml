name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: credbound
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d credbound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CREDBOUND_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/credbound?sslmode=disable
    steps:
      # Third-party actions are pinned to full commit SHAs so a hijacked or
      # re-pointed tag cannot inject code into CI; bump by updating the SHA
      # and the version comment together.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Verify generated sources
        run: |
          make generate
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: make lint
      - name: Race tests with PostgreSQL
        run: go test -race ./...
      - name: Coverage
        run: make coverage
      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-package: ./...
