version: "2"
sql:
  - name: postgresql
    engine: postgresql
    schema: sql/schema/postgresql.sql
    queries: sql/queries/postgresql.sql
    gen:
      go:
        package: postgresql
        out: internal/sqlc/postgresql
        sql_package: database/sql
        emit_empty_slices: false
        emit_json_tags: true
        overrides:
          # dbtype.UUID is pgx pgtype.UUID: it carries the database interfaces the
          # identifier type itself does not — raw 16 bytes plus a Valid flag, so one
          # type covers both nullable and non-nullable columns, and it needs no
          # change if the store later moves to pgx's native protocol.
          - db_type: uuid
            go_type: &uuid "github.com/deepteams/credbound/internal/dbtype.UUID"
          - db_type: uuid
            nullable: true
            go_type: *uuid
